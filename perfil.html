<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title id="pageTitle">Perfil — Q&amp;V Tech</title>

<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
 
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
 
<style>
:root{
  --white:#ffffff;
  --green-dark:#1b4332;
  --green-mid:#2d6a4f;
  --green-bright:#52b788;
  --green-soft:#95d5b2;
  --green-glow:rgba(82,183,136,.55);
  --slate:#2f3e46;
  --ink:#16211d;
  --muted:#4c5a54;
  --line:rgba(27,67,50,.13);
  --display:'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
  --body:'Karla', ui-sans-serif, system-ui, -apple-system, sans-serif;
  --ease:cubic-bezier(.65,0,.35,1);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  min-height:100%;
  background:var(--white);
  color:var(--ink);
  font-family:var(--body);
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  overflow-x:hidden;
}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;line-height:1.1;}
a{color:inherit;text-decoration:none;}
::selection{background:var(--green-bright);color:#fff;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
}
 
/* ================= FONDO ANIMADO (idéntico al sitio) ================= */
.bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background-color:#ffffff;
  background-image: repeating-linear-gradient(-35deg, transparent, transparent 12px, rgba(45,106,79,0.03) 12px, rgba(45,106,79,0.03) 14px);
}
.orb{position:absolute;border-radius:50%;}
.orb-1{width:46vmax;height:46vmax;top:-18vmax;right:-14vmax;background:radial-gradient(circle at 38% 38%, rgba(82,183,136,.18), rgba(149,213,178,.08) 60%, transparent 72%);animation:orbFloat 26s ease-in-out infinite;}
.orb-2{width:32vmax;height:32vmax;bottom:-13vmax;left:-10vmax;background:radial-gradient(circle at 55% 45%, rgba(45,106,79,.14), rgba(82,183,136,.06) 58%, transparent 74%);animation:orbFloat 34s ease-in-out infinite reverse;}
.orb-3{width:15vmax;height:15vmax;top:26%;left:34%;background:radial-gradient(circle at 42% 40%, rgba(82,183,136,.15), transparent 70%);animation:orbFloat 21s ease-in-out infinite;}
@keyframes orbFloat{0%,100%{transform:translate3d(0,0,0) scale(1);}50%{transform:translate3d(-3vmax,3vmax,0) scale(1.07);}}
.decor-circle{position:absolute;border-radius:50%;border:2px dashed rgba(82,183,136,.25);pointer-events:none;z-index:0;}
.decor-circle-top{width:180px;height:180px;top:-50px;right:10%;background:radial-gradient(circle, rgba(82,183,136,0.08) 0%, transparent 70%);animation:orbFloat 15s ease-in-out infinite;}
.decor-circle-bottom{width:240px;height:240px;bottom:-80px;left:8%;background:radial-gradient(circle, rgba(45,106,79,0.06) 0%, transparent 70%);animation:orbFloat 22s ease-in-out infinite reverse;}
.halftone{position:absolute;background-image:radial-gradient(rgba(45,106,79,.25) 1.6px, transparent 1.7px);background-size:13px 13px;animation:dotDrift 18s linear infinite;}
.ht-1{width:34vmax;height:30vmax;right:-4vmax;bottom:6vh;transform:rotate(-40deg);-webkit-mask-image:radial-gradient(ellipse at 60% 50%, #000 15%, transparent 68%);mask-image:radial-gradient(ellipse at 60% 50%, #000 15%, transparent 68%);opacity:.45;}
.ht-2{width:22vmax;height:20vmax;left:-3vmax;top:8vh;transform:rotate(-40deg);-webkit-mask-image:radial-gradient(ellipse at 45% 50%, #000 10%, transparent 64%);mask-image:radial-gradient(ellipse at 45% 50%, #000 10%, transparent 64%);opacity:.35;}
@keyframes dotDrift{0%{background-position:0 0;}100%{background-position:52px 52px;}}
.streaks{position:absolute;width:260%;height:260%;left:-80%;top:-80%;transform:rotate(-35deg);display:flex;flex-direction:column;justify-content:center;gap:3.5vmax;}
.track{display:flex;align-items:center;gap:3.5vmax;width:max-content;will-change:transform;}
.track i{display:block;height:5.5vmax;min-height:42px;border-radius:999px;flex:none;}
.track i.solid{background:#52b788;opacity:.45;}
.track i.pale{background:#2d6a4f;opacity:.45;}
.track i.line{background:#95d5b2;opacity:.4;}
.track i.dark{background:#1b4332;opacity:.5;}
.track i.dot{height:5.5vmax;min-height:42px;width:5.5vmax;min-width:42px;border-radius:50%;background:#2d6a4f;opacity:.45;}
.t1{animation:slide 38s linear infinite;} .t2{animation:slide 50s linear infinite;} .t3{animation:slide 32s linear infinite;}
.t4{animation:slide 58s linear infinite;} .t5{animation:slide 42s linear infinite;} .t6{animation:slide 48s linear infinite;} .t7{animation:slide 34s linear infinite;}
@keyframes slide{from{transform:translate3d(0,0,0);}to{transform:translate3d(-50%,0,0);}}
.bg-veil{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 40%, rgba(255,255,255,.8) 0%, rgba(255,255,255,.5) 55%, rgba(255,255,255,.18) 100%);}
 
/* ================= CONTENIDO ================= */
main.wrap{
  position:relative;z-index:1;
  min-height:100vh;min-height:100dvh;
  display:flex;align-items:center;justify-content:center;
  padding:44px 18px 34px;
}
 
@keyframes bounceIn{
  0%{opacity:0;transform:scale(.4) translateY(36px);}
  55%{opacity:1;transform:scale(1.04) translateY(-8px);}
  75%{transform:scale(.97) translateY(4px);}
  100%{opacity:1;transform:scale(1) translateY(0);}
}
.card{
  width:100%;max-width:430px;position:relative;
  background:rgba(255,255,255,.86);
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(82,183,136,.22);
  border-radius:30px;
  padding:clamp(30px,6vw,42px) clamp(22px,5vw,32px) 30px;
  box-shadow:0 34px 70px -24px rgba(27,67,50,.35), inset 0 1px 0 rgba(255,255,255,.9);
  overflow:hidden;
  animation:bounceIn .8s cubic-bezier(.215,.61,.355,1) both;
}
.card::before{
  content:'';position:absolute;left:0;top:28px;bottom:28px;width:4px;
  border-radius:0 4px 4px 0;
  background:linear-gradient(var(--green-bright),var(--green-mid));
}
 
.avatar-ring{
  width:104px;height:104px;border-radius:30px;margin:0 auto 20px;
  padding:4px;
  background:linear-gradient(145deg,var(--green-bright),var(--green-dark));
  box-shadow:0 16px 34px -12px rgba(27,67,50,.5);
  animation:bounceIn .8s cubic-bezier(.215,.61,.355,1) .1s both;
}
.avatar{
  width:100%;height:100%;border-radius:24px;overflow:hidden;
  background:linear-gradient(145deg,var(--green-mid),var(--green-dark));
  display:flex;align-items:center;justify-content:center;
}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.avatar span{font-family:var(--display);font-weight:800;font-size:2.5rem;color:#fff;}
 
h1#bizName{
  font-size:clamp(1.4rem,5vw,1.7rem);font-weight:800;text-align:center;color:var(--green-dark);
  margin-bottom:5px;
  animation:bounceIn .8s cubic-bezier(.215,.61,.355,1) .16s both;
}
.subtitle{
  text-align:center;color:var(--muted);font-size:.92rem;margin-bottom:18px;
  animation:bounceIn .8s cubic-bezier(.215,.61,.355,1) .2s both;
}
.hours-pill{
  display:block;margin:0 auto 26px;width:max-content;max-width:100%;
  background:var(--green-soft);color:var(--green-dark);
  font-weight:700;font-size:.78rem;letter-spacing:.01em;
  padding:7px 16px;border-radius:999px;
  animation:bounceIn .8s cubic-bezier(.215,.61,.355,1) .24s both;
}
 
.links{display:flex;flex-direction:column;gap:12px;}
.links .btn{opacity:0;transform:scale(.4) translateY(36px);animation:bounceIn .7s cubic-bezier(.215,.61,.355,1) forwards;}
.links .btn:nth-child(1){animation-delay:.28s;}
.links .btn:nth-child(2){animation-delay:.35s;}
.links .btn:nth-child(3){animation-delay:.42s;}
.links .btn:nth-child(4){animation-delay:.49s;}
.links .btn:nth-child(5){animation-delay:.56s;}
.links .btn:nth-child(6){animation-delay:.63s;}
 
.btn{
  display:flex;align-items:center;gap:13px;
  width:100%;padding:15px 18px;border-radius:18px;
  background:rgba(255,255,255,.7);border:1.5px solid var(--line);
  font-family:var(--body);font-weight:700;font-size:.98rem;color:var(--ink);
  transition:transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s var(--ease), background .25s var(--ease);
}
.btn:active{transform:scale(.97);}
.btn:hover{border-color:var(--green-bright);box-shadow:0 14px 26px -14px rgba(27,67,50,.4);transform:translateY(-2px);background:#fff;}
.btn .ic{
  width:38px;height:38px;border-radius:12px;flex:none;
  display:flex;align-items:center;justify-content:center;color:#fff;
  background:linear-gradient(135deg,var(--green-mid),var(--green-dark));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
}
.btn .ic svg{width:19px;height:19px;fill:currentColor;}
.btn .label small{display:block;font-weight:500;color:var(--muted);font-size:.76rem;margin-top:1px;}
 
.btn.primary{
  background:linear-gradient(135deg,#52b788 0%,#2d6a4f 100%);
  color:#fff;border-color:transparent;
  box-shadow:0 16px 32px -12px rgba(82,183,136,.65);
}
.btn.primary:hover{
  background:linear-gradient(135deg,#61c99a 0%,#3a865f 100%);
  box-shadow:0 20px 38px -12px rgba(82,183,136,.8);
}
.btn.primary .ic{background:rgba(255,255,255,.2);}
.btn.primary .label small{color:rgba(255,255,255,.8);}
 
.empty{text-align:center;color:var(--muted);padding:34px 6px;font-size:.95rem;line-height:1.5;}
 
footer{margin-top:30px;text-align:center;position:relative;z-index:1;}
.badge{
  display:inline-flex;align-items:center;gap:7px;
  font-size:.74rem;color:var(--muted);font-weight:700;
  padding:8px 14px;border-radius:999px;border:1px solid var(--line);
  background:rgba(255,255,255,.6);
}
.badge img{width:15px;height:15px;border-radius:4px;object-fit:cover;}
.badge b{color:var(--green-dark);}
 
@media (max-width:380px){
  .btn{padding:13px 14px;font-size:.92rem;}
  .btn .ic{width:34px;height:34px;}
}
</style>
</head>
<body>
 
<div class="bg" aria-hidden="true">
  <span class="orb orb-1"></span>
  <span class="orb orb-2"></span>
  <span class="orb orb-3"></span>
  <span class="decor-circle decor-circle-top"></span>
  <span class="decor-circle decor-circle-bottom"></span>
  <span class="halftone ht-1"></span>
  <span class="halftone ht-2"></span>
  <div class="streaks" id="streaks"></div>
</div>
<div class="bg-veil" aria-hidden="true"></div>
 
<main class="wrap">
  <div class="card">
    <div class="avatar-ring"><div class="avatar" id="avatar"><span id="avatarLetter">Q</span></div></div>
    <h1 id="bizName">Cargando…</h1>
    <div class="subtitle" id="bizCity"></div>
    <div class="hours-pill" id="hoursPill" style="display:none;"></div>
 
    <div class="links" id="links"></div>
  </div>
</main>
 
<footer>
  <span class="badge"><img src="logo.jpg" alt="" onerror="this.style.display='none'">Tarjeta NFC por <b>Q&amp;V Tech</b></span>
</footer>
 
<script>
/* ---------- fondo: mismos trazos diagonales del sitio ---------- */
(function(){
  var host = document.getElementById('streaks');
  var styles = ['solid','pale','line','solid','dark','pale','dot','solid','pale','line'];
  var widths = [28,15,36,10,22,46,13,1,32,18,40,9,26,16,52,12];
  for (var r = 0; r < 7; r++){
    var track = document.createElement('div');
    track.className = 'track t' + (r + 1);
    var half = document.createElement('span');
    half.style.display = 'flex'; half.style.alignItems = 'center'; half.style.gap = '3.5vmax';
    for (var i = 0; i < 12; i++){
      var bar = document.createElement('i');
      var kind = styles[(i + r * 3) % styles.length];
      bar.className = kind;
      if (kind !== 'dot'){ bar.style.width = widths[(i + r * 5) % widths.length] + 'vmin'; }
      half.appendChild(bar);
    }
    track.appendChild(half);
    track.appendChild(half.cloneNode(true));
    track.style.animationDelay = (-r * 5) + 's';
    host.appendChild(track);
  }
})();
 
/* ---------- perfil dinámico ---------- */
(function(){
  'use strict';
 
  /* Claves públicas de Supabase (es seguro que estén aquí) */
  var SUPABASE_URL = 'https://rzhkzrjijfsadkzsusgd.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_Jw1lkEwn2tpPi8HxI3N1mg_0bBE4HRr';
 
  var linksBox = document.getElementById('links');
 
  var ICONS = {
    whatsapp: '<svg viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.39 1.26 4.82L2 22l5.42-1.36a9.9 9.9 0 0 0 4.62 1.14h.01c5.46 0 9.9-4.45 9.9-9.9C21.95 6.45 17.5 2 12.04 2Zm5.8 14.02c-.24.68-1.4 1.3-1.94 1.38-.5.08-1.12.11-1.8-.11-.42-.13-.95-.3-1.64-.6-2.9-1.25-4.8-4.17-4.94-4.37-.14-.2-1.18-1.57-1.18-3 0-1.42.75-2.12 1.02-2.41.27-.29.58-.36.78-.36h.56c.18 0 .42-.07.65.5.24.58.82 2 .89 2.15.07.14.11.31.02.5-.09.19-.14.31-.28.47-.14.16-.29.36-.42.48-.14.13-.28.28-.12.55.16.27.71 1.18 1.53 1.91 1.05.94 1.94 1.24 2.21 1.38.27.14.43.11.59-.07.16-.18.68-.79.86-1.06.18-.27.36-.22.6-.13.24.09 1.53.72 1.79.85.26.13.43.19.5.3.07.11.07.63-.17 1.3Z"/></svg>',
    instagram: '<svg viewBox="0 0 24 24"><path d="M12 2.16c3.2 0 3.58.01 4.85.07 1.17.05 1.97.24 2.43.4a4.9 4.9 0 0 1 1.77 1.15c.53.53.9 1.08 1.15 1.77.17.46.35 1.26.4 2.43.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.05 1.17-.23 1.97-.4 2.43a4.9 4.9 0 0 1-1.15 1.77 4.9 4.9 0 0 1-1.77 1.15c-.46.17-1.26.35-2.43.4-1.27.06-1.65.07-4.85.07s-3.58-.01-4.85-.07c-1.17-.05-1.97-.23-2.43-.4a4.9 4.9 0 0 1-1.77-1.15 4.9 4.9 0 0 1-1.15-1.77c-.17-.46-.35-1.26-.4-2.43C2.17 15.58 2.16 15.2 2.16 12s.01-3.58.07-4.85c.05-1.17.23-1.97.4-2.43a4.9 4.9 0 0 1 1.15-1.77A4.9 4.9 0 0 1 5.55 1.8c.46-.16 1.26-.34 2.43-.39C9.25 1.35 9.63 1.34 12 1.34zm0 3.36a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zm0 10.72a4.22 4.22 0 1 1 0-8.44 4.22 4.22 0 0 1 0 8.44zm6.76-10.98a1.52 1.52 0 1 1-3.04 0 1.52 1.52 0 0 1 3.04 0z"/></svg>',
    facebook: '<svg viewBox="0 0 24 24"><path d="M22 12.06C22 6.5 17.52 2 11.94 2S1.88 6.5 1.88 12.06c0 5.02 3.66 9.18 8.44 9.94v-7.03H7.9v-2.9h2.42V9.9c0-2.39 1.42-3.71 3.6-3.71 1.04 0 2.13.19 2.13.19v2.34h-1.2c-1.18 0-1.55.74-1.55 1.5v1.8h2.64l-.42 2.9h-2.22V22c4.78-.76 8.44-4.92 8.44-9.94z"/></svg>',
    tiktok: '<svg viewBox="0 0 24 24"><path d="M16.6 2h-3.2v13.4a2.9 2.9 0 1 1-2.05-2.77V9.4a6.1 6.1 0 1 0 5.25 6.05V8.63c1.24.9 2.77 1.43 4.4 1.43V6.86c-2.4 0-4.4-1.98-4.4-4.86z"/></svg>',
    website: '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm7.93 9h-3.02c-.13-2.16-.68-4.1-1.5-5.53A8.02 8.02 0 0 1 19.93 11zM12 4.06c1 0 2.28 2.1 2.6 5.94H9.4C9.72 6.16 11 4.06 12 4.06zM4.07 13h3.02c.13 2.16.68 4.1 1.5 5.53A8.02 8.02 0 0 1 4.07 13zm0-2A8.02 8.02 0 0 1 8.59 5.47C7.77 6.9 7.22 8.84 7.09 11H4.07zM12 19.94c-1 0-2.28-2.1-2.6-5.94h5.2c-.32 3.84-1.6 5.94-2.6 5.94zm3.41-.41c.82-1.43 1.37-3.37 1.5-5.53h3.02a8.02 8.02 0 0 1-4.52 5.53z"/></svg>',
    maps: '<svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>'
  };
 
  /* Solo se permiten links http(s): evita "javascript:" y similares */
  function safeUrl(u){
    try{
      var x = new URL(u, window.location.href);
      return (x.protocol === 'https:' || x.protocol === 'http:') ? x.href : null;
    }catch(e){ return null; }
  }
 
  function makeBtn(opts){
    var href = safeUrl(opts.href);
    if(!href) return null;
    var a = document.createElement('a');
    a.className = 'btn' + (opts.primary ? ' primary' : '');
    a.href = href; a.target = '_blank'; a.rel = 'noopener';
 
    var ic = document.createElement('span');
    ic.className = 'ic';
    ic.innerHTML = ICONS[opts.icon] || ICONS.website;   /* SVG fijo, no viene de datos */
 
    var label = document.createElement('span');
    label.className = 'label';
    label.appendChild(document.createTextNode(opts.label));
    if(opts.sub){
      var small = document.createElement('small');
      small.textContent = opts.sub;
      label.appendChild(small);
    }
    a.appendChild(ic); a.appendChild(label);
    return a;
  }
 
  function showMessage(title, msg, letter){
    document.getElementById('pageTitle').textContent = title + ' — Q&V Tech';
    document.getElementById('bizName').textContent = title;
    document.getElementById('bizCity').textContent = '';
    document.getElementById('avatarLetter').textContent = letter || '?';
    document.getElementById('hoursPill').style.display = 'none';
    linksBox.innerHTML = '';
    var p = document.createElement('div');
    p.className = 'empty';
    p.textContent = msg;
    linksBox.appendChild(p);
  }
 
  /* d: { name, city, logo_url, whatsapp, hours, instagram, tiktok, facebook, website, address, maps_url } */
  function render(d){
    var name = d.name || 'Negocio';
    document.getElementById('pageTitle').textContent = name + ' — Q&V Tech';
    document.getElementById('bizName').textContent = name;
    if(d.city){ document.getElementById('bizCity').textContent = d.city; }
 
    var logo = d.logo_url ? safeUrl(d.logo_url) : null;
    if(logo){
      var img = document.createElement('img');
      img.src = logo; img.alt = name;
      img.onerror = function(){
        document.getElementById('avatar').innerHTML = '';
        var sp = document.createElement('span');
        sp.textContent = name.trim().charAt(0).toUpperCase();
        document.getElementById('avatar').appendChild(sp);
      };
      document.getElementById('avatar').innerHTML = '';
      document.getElementById('avatar').appendChild(img);
    } else {
      document.getElementById('avatarLetter').textContent = name.trim().charAt(0).toUpperCase();
    }
 
    if(d.hours){
      var hp = document.getElementById('hoursPill');
      hp.textContent = d.hours; hp.style.display = 'block';
    }
 
    linksBox.innerHTML = '';
    function add(btn){ if(btn) linksBox.appendChild(btn); }
 
    if(d.whatsapp){
      var digits = String(d.whatsapp).replace(/\D/g,'');
      if(digits){
        var msg = encodeURIComponent('Hola ' + name + ', te escribo desde tu perfil Q&V Tech');
        add(makeBtn({icon:'whatsapp', href:'https://wa.me/' + digits + '?text=' + msg, label:'WhatsApp', sub:'Escríbenos directo', primary:true}));
      }
    }
    if(d.instagram){
      var ig = String(d.instagram).replace('@','');
      add(makeBtn({icon:'instagram', href:'https://instagram.com/' + encodeURIComponent(ig), label:'Instagram', sub:'@' + ig}));
    }
    if(d.facebook){
      var fb = String(d.facebook);
      add(makeBtn({icon:'facebook', href: fb.indexOf('http') === 0 ? fb : 'https://facebook.com/' + encodeURIComponent(fb), label:'Facebook'}));
    }
    if(d.tiktok){
      var tt = String(d.tiktok);
      var ttUser = tt.replace('@','');
      add(makeBtn({icon:'tiktok', href: tt.indexOf('http') === 0 ? tt : 'https://tiktok.com/@' + encodeURIComponent(ttUser), label:'TikTok', sub: tt.indexOf('http') === 0 ? '' : '@' + ttUser}));
    }
    if(d.website){
      var w = String(d.website);
      add(makeBtn({icon:'website', href: w.indexOf('http') === 0 ? w : 'https://' + w, label:'Sitio web'}));
    }
    if(d.maps_url){
      add(makeBtn({icon:'maps', href:d.maps_url, label:'Cómo llegar', sub:d.address || ''}));
    }
 
    if(!linksBox.children.length){
      var p2 = document.createElement('div');
      p2.className = 'empty';
      p2.textContent = 'Este negocio aún no cargó sus links.';
      linksBox.appendChild(p2);
    }
  }
 
  /* ---- Links antiguos (?d=...): se siguen mostrando para no romper tarjetas ya programadas ---- */
  function b64DecodeUnicode(str){
    return decodeURIComponent(atob(str).split('').map(function(c){
      return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
  }
  function readLegacy(raw){
    try{
      var o = JSON.parse(b64DecodeUnicode(decodeURIComponent(raw)));
      return {
        name:o.n, city:o.city, logo_url:o.l, whatsapp:o.w, hours:o.h,
        instagram:o.ig, tiktok:o.tt, facebook:o.fb, website:o.web, address:o.addr, maps_url:o.map
      };
    }catch(e){ return null; }
  }
 
  /* ---- Links nuevos (?id=...): los datos se leen desde Supabase ---- */
  var UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
 
  function loadById(id){
    var ctrl = ('AbortController' in window) ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, 12000) : null;
    fetch(SUPABASE_URL + '/rest/v1/rpc/get_public_profile', {
      method:'POST',
      headers:{ 'apikey':SUPABASE_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ p_id:id }),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function(res){
      if(timer) clearTimeout(timer);
      if(!res.ok) throw new Error('http ' + res.status);
      return res.json();
    }).then(function(data){
      if(!data){
        showMessage('Perfil no encontrado', 'Este link no tiene un perfil válido. Contacta a Q&V Tech para generar tu tarjeta.', '?');
      } else if(data.active === false){
        showMessage('Perfil no disponible', 'Este perfil está temporalmente desactivado. Si eres el dueño del negocio, contacta a Q&V Tech.', '!');
      } else {
        render(data);
      }
    }).catch(function(){
      if(timer) clearTimeout(timer);
      showMessage('No se pudo cargar', 'Revisa tu conexión e intenta abrir el link de nuevo en unos segundos.', '…');
    });
  }
 
  var params = new URLSearchParams(window.location.search);
  var id = params.get('id');
  var legacy = params.get('d');
 
  if(id){
    if(UUID_RE.test(id)){ loadById(id); }
    else { showMessage('Perfil no encontrado', 'Este link no tiene un perfil válido. Contacta a Q&V Tech para generar tu tarjeta.', '?'); }
  } else if(legacy){
    var d = readLegacy(legacy);
    if(d && d.name){ render(d); }
    else { showMessage('Perfil no encontrado', 'Este link no tiene un perfil válido. Contacta a Q&V Tech para generar tu tarjeta.', '?'); }
  } else {
    showMessage('Perfil no encontrado', 'Este link no tiene un perfil válido. Contacta a Q&V Tech para generar tu tarjeta.', '?');
  }
})();
</script>
